    <rect x="8" y="28" width="8" height="8" rx="0.6"/><rect x="48" y="28" width="8" height="8" rx="0.6"/>
    <rect x="8" y="38" width="8" height="8" rx="0.6"/><rect x="48" y="38" width="8" height="8" rx="0.6"/>
    <rect x="8" y="48" width="8" height="8" rx="0.6"/><rect x="48" y="48" width="8" height="8" rx="0.6"/>
  </g>
  <rect x="28" y="28" width="8" height="8" rx="0.6" fill="#F0FFC4"/>
