  <g fill="#C8FF2E" fill-opacity="0.16">
    <rect x="18" y="8" width="8" height="8" rx="0.6"/><rect x="28" y="8" width="8" height="8" rx="0.6"/><rect x="38" y="8" width="8" height="8" rx="0.6"/>
    <rect x="28" y="18" width="8" height="8" rx="0.6"/>
    <rect x="18" y="28" width="8" height="8" rx="0.6"/><rect x="38" y="28" width="8" height="8" rx="0.6"/>
    <rect x="18" y="38" width="8" height="8" rx="0.6"/><rect x="28" y="38" width="8" height="8" rx="0.6"/><rect x="38" y="38" width="8" height="8" rx="0.6"/>
    <rect x="18" y="48" width="8" height="8" rx="0.6"/><rect x="28" y="48" width="8" height="8" rx="0.6"/><rect x="38" y="48" width="8" height="8" rx="0.6"/>
  </g>
  <g fill="#C8FF2E">
