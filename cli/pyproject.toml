[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "modelswarm"
version = "0.1.0"
description = "Experimental verified model downloads over BitTorrent v2 and HTTP"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = ["libtorrent==2.1.1"]

[project.scripts]
modelswarm = "modelswarm.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
modelswarm = ["bridge/index.mjs", "bridge/protocol.mjs", "bridge/package.json", "bridge/yarn.lock", "bridge/.yarnrc.yml"]
